# PORAI sandbox API (on the staging server)
server {
  listen      443 ssl;
  server_name api-sandbox.porai.ai;
  
  ssl_certificate     /etc/letsencrypt/live/porai.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/porai.ai/privkey.pem;

  client_max_body_size 70M;

  location / {
    proxy_pass http://10.8.0.2:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# PORAI sandbox app, with WebSocket support (on the staging server)
server {
  listen      443 ssl;
  server_name app-sandbox.porai.ai;

  ssl_certificate     /etc/letsencrypt/live/porai.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/porai.ai/privkey.pem;

  client_max_body_size 70M;

  location / {
    proxy_pass http://10.8.0.2:80/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

