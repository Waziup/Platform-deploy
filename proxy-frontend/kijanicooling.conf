# KijaniCooling Website
server {
    listen      443 ssl;
    server_name www.kijanicooling.eu;
    client_max_body_size 512M;
    location / {
        proxy_pass http://wordpress;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect from kijanicooling.eu to www.kijanicooling.eu
server {
  listen      443 ssl;
  server_name kijanicooling.eu;
  location / {
    return 301  https://www.kijanicooling.eu$request_uri;
  }
}